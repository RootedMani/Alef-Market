{% extends "base.html" %}

{% block content %}
<section class="card">
  <h1>اسکلت پروژه آماده است</h1>
  <p>وضعیت سرور:
    <span id="health" hx-get="/api/health" hx-trigger="load" hx-swap="none">در حال بررسی…</span>
  </p>
</section>

<section class="card">
  <h2>نمودار BTC/USDT</h2>
  <!-- The chart stays LTR inside the RTL page (Brief risk #7). -->
  <div id="chart" class="chart" dir="ltr" data-symbol="BTC/USDT" data-timeframe="1m"></div>
  <p class="muted" id="chart-status"></p>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='vendor/lightweight-charts-5.2.1.js') }}"></script>
<script src="{{ url_for('static', path='js/chart.js') }}"></script>
<script>
  document.body.addEventListener("htmx:afterRequest", (e) => {
    if (e.detail.elt.id !== "health") return;
    const el = document.getElementById("health");
    try {
      const h = JSON.parse(e.detail.xhr.responseText);
      el.textContent = h.status === "ok" ? "سالم ✓" : "مشکل در پایگاه داده";
    } catch { el.textContent = "در دسترس نیست"; }
  });
</script>
{% endblock %}
